    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meteo Doodle — a hand-drawn weather intelligence dashboard built with React, Vite, Tailwind CSS and the Weatherstack API." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Meteo Doodle · Weather Intelligence Dashboard</title>
    <script>
      // Prevent theme flash: default to stored choice, else OS preference
      (function () {
        try {
          var stored = localStorage.getItem('zephyr-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
